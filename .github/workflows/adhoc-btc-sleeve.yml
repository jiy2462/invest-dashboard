name: 일회성 분석 - 비트코인 돌파 주머니

# 분석용 브랜치에서만 돈다 (main에 합치지 않음)
on:
  push:
    branches: [claude/project-thread-6kjiq4]
    paths: [scripts/adhoc_btc_sleeve.py, .github/workflows/adhoc-btc-sleeve.yml]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/adhoc_btc_sleeve.py
