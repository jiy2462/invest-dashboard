name: adhoc market probe
on:
  push:
    branches: [claude/project-thread-of7pfk]
    paths: [scripts/adhoc_market_probe.py, .github/workflows/adhoc-market-probe.yml]
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/adhoc_market_probe.py
