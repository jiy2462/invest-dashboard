name: 앱 깨워 두기 (브랜치 시험용, 머지 전 삭제)
on:
  push:
    branches: [claude/project-thread-y0hsm8]
permissions:
  contents: read
  actions: write
jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright 브라우저가 공식 지원하는 OS로 고정
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "playwright==1.55.0" && python -m playwright install --with-deps chromium
      - name: 비밀값 APP_URL 로 시험
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then python scripts/keep_awake.py; else echo "APP_URL 비밀값 없음"; fi
      - name: 실제 Streamlit Cloud 앱(영화 추천)으로 동작 확인
        run: APP_URL=https://cine-taste.streamlit.app KEEP_AWAKE_READY_TEXTS=" " python scripts/keep_awake.py
      - name: 주소 후보 확인 (주소는 출력하지 않음)
        run: |
          i=0
          for u in https://invest-dashboard.streamlit.app https://jiy2462-invest-dashboard.streamlit.app https://invest-dashboard-jiy2462.streamlit.app; do
            i=$((i+1))
            APP_URL="$u" KEEP_AWAKE_TIMEOUT=90 python scripts/keep_awake.py >/tmp/o.txt 2>&1 && echo "후보 $i 는 대시보드로 열림" || echo "후보 $i 는 대시보드 아님"
          done
      - name: 예약 작업 다시 켜기 권한 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-insight.yml/enable" && echo "켜기 성공"
